<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>RTM Console</title>
<style>
  html, body { margin:0; height:100%; }
  body { background:var(--surface-card); color:var(--text-heading); font-family:var(--font-brand, var(--bits-font-brand)); overflow:hidden; }
  .cover { position:relative; height:288px; overflow:hidden; background:var(--surface-card); }
  .art { position:absolute; top:0; left:480px; width:480px; height:288px; overflow:hidden; }
  .art svg { display:block; width:480px; height:288px; }
  .brand { fill:var(--purple); }
  .deep { fill:var(--dark-purple); }
  .signal { fill:var(--turquoise); }
  .tint { fill:var(--pale-purple); }
  .mid { fill:var(--light-purple); }
  .blk { rx:var(--radius-20); }
  .tile { rx:var(--radius-8); }
  .words { position:absolute; left:var(--space-8); bottom:var(--space-8); max-width:440px; }
  .name { margin:0; font-size:100px; line-height:.95; font-weight:500; letter-spacing:-.02em; color:var(--text-heading); }
  .tag { margin:var(--space-3) 0 0 4px; font-size:14px; line-height:20px; color:var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="480 0 480 288" width="480" height="288">
<!--
  blocks      purple 160×220 bled off the top (the brand colour, the tall slab) · dark-purple 288×224 bleeding off the right edge (the deep ground) · turquoise 160×48 (the On Call and Nudge signal) · pale-purple and light-purple only as tiles: about 38% of 960×288
  arrangement one tall purple slab with a turquoise foot, beside a wide dark-purple block; bottoms on one line space-6 above the edge, space-4 gutters
  pattern     tiles cut by the radius tokens, some merged two-wide: the agent grid, the screen this console is known by ("One agent on the grid"; cards fill with auto-fill columns)
  scales      tiles 48×32 (space-6 × 2 by space-8) at a space-2 gap, inset space-4; blocks radius-20, tiles radius-8
-->
<rect class="brand blk" x="496" y="-20" width="160" height="220" rx="20"/>
<rect class="signal blk" x="496" y="216" width="160" height="48" rx="20"/>
<rect class="deep blk" x="672" y="40" width="308" height="224" rx="20"/>

<rect class="mid tile" x="512" y="112" width="104" height="32" rx="8"/>
<rect class="mid tile" x="512" y="152" width="48" height="32" rx="8"/>

<rect class="tint tile" x="688" y="56" width="48" height="32" rx="8"/>
<rect class="mid tile" x="744" y="56" width="48" height="32" rx="8"/>
<rect class="mid tile" x="800" y="56" width="104" height="32" rx="8"/>
<rect class="signal tile" x="912" y="56" width="48" height="32" rx="8"/>

<rect class="mid tile" x="688" y="96" width="48" height="32" rx="8"/>
<rect class="signal tile" x="744" y="96" width="48" height="32" rx="8"/>
<rect class="tint tile" x="800" y="96" width="48" height="32" rx="8"/>
<rect class="mid tile" x="856" y="96" width="48" height="32" rx="8"/>
<rect class="mid tile" x="912" y="96" width="48" height="32" rx="8"/>

<rect class="signal tile" x="688" y="136" width="104" height="32" rx="8"/>
<rect class="mid tile" x="800" y="136" width="48" height="32" rx="8"/>
<rect class="mid tile" x="856" y="136" width="48" height="32" rx="8"/>
<rect class="tint tile" x="912" y="136" width="48" height="32" rx="8"/>

<rect class="mid tile" x="688" y="176" width="48" height="32" rx="8"/>
<rect class="tint tile" x="744" y="176" width="48" height="32" rx="8"/>
<rect class="mid tile" x="800" y="176" width="48" height="32" rx="8"/>
<rect class="signal tile" x="856" y="176" width="48" height="32" rx="8"/>
<rect class="mid tile" x="912" y="176" width="48" height="32" rx="8"/>

<rect class="mid tile" x="688" y="216" width="48" height="32" rx="8"/>
<rect class="mid tile" x="744" y="216" width="48" height="32" rx="8"/>
<rect class="tint tile" x="800" y="216" width="104" height="32" rx="8"/>
<rect class="mid tile" x="912" y="216" width="48" height="32" rx="8"/>
</svg>
</div>
<div class="words">
<h1 class="name">RTM<br>Console</h1>
<p class="tag">Real-Time Monitoring &amp; Escalation</p>
</div>
</div>
</body>
</html>
